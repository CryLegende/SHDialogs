# Messages du chat de SHDialogs. Codes de couleur : &a, &l... et &#rrggbb.
# Les variables s'écrivent {nom} ; chaque message dit les siennes.

# Préfixe des messages du chat. {couleur} est remplacé par la couleur du type de message (voir plus bas).
prefixe: '&7&l« &{couleur}&lSH &8&l» &7'
couleurs:
  erreur: 'c'
  succes: 'a'
  info: 'e'
  avertissement: '6'

# Mots repris dans les messages (/shdialogs list)
mots:
  oui: '&aoui&7'
  non: '&cnon&7'
  aucune: 'aucune'

erreur:
  joueur-seulement: 'Commande réservée aux &cjoueurs&7.'
  permission: 'Vous n''avez pas la permission.'
  # {sous-commandes} : les sous-commandes que l'expéditeur a le droit d'utiliser
  usage-liste: 'Utilisation : &e/shdialogs <{sous-commandes}>&7.'
  open-usage: 'Utilisation : &e/shdialogs open <dialogue> [joueur] [valeurs...]&7.'
  openlater-usage: 'Utilisation : &e/shdialogs openlater <ticks de 1 à 200> <dialogue> <joueur> [valeurs...]&7.'
  # {dialogue} et {attendues} : nombre de valeurs ({1}, {2}...) que le dialogue attend après le joueur
  valeurs-manquantes: 'Le dialogue &e{dialogue} &7attend &e{attendues} &7valeur(s) après le joueur.'
  valeurs-inattendues: 'Le dialogue &e{dialogue} &7n''attend pas de valeur après le joueur.'
  dialogue-inconnu: 'Le dialogue &e{dialogue} &7n''existe pas.'
  dialogue-permission: 'Vous n''avez pas accès à ce dialogue.'
  joueur-introuvable: 'Le joueur &e{joueur} &7n''est pas connecté.'
  console-joueur: 'La console doit indiquer un joueur : &e/shdialogs open <dialogue> <joueur>&7.'
  menu-indisponible: 'Le menu SkyHand n''est pas chargé (voir la console).'
  bouton-indisponible: 'Ce bouton n''est plus disponible.'
  bouton-permission: 'Vous n''avez pas accès à &e{bouton}&7.'
  commande-echec: 'La commande &e/{commande} &7n''a pas pu être lancée.'
  version-ancienne: 'Ta version de Minecraft est trop ancienne pour ce menu. Passe en &c1.21.6 &7ou plus récent pour l''ouvrir.'
  erreur-interne: 'Une erreur est survenue : réessayez, ou prévenez un membre du &cstaff&7.'
  # {fichier} : fichier invalide, {erreur} : cause
  reload-erreur: 'Rechargement refusé : &c{fichier}&7 est invalide, l''ancienne configuration reste en place. &c{erreur}'
  # {dialogue} et {cause}
  list-erreur: '&c{dialogue} &7: &cen erreur&7 ({cause})'
  # {fichier} et {cause} : fichier du dossier dialogues qui n'a pas pu être lu
  list-fichier-illisible: '&c{fichier} &7est illisible et ignoré (&c{cause}&7).'
  # Bouton dont l'exigence n'est pas remplie et qui n'a pas de lignes refus
  exigence-refusee: 'Vous n''avez pas ce qu''il faut pour faire cela.'

succes:
  recharge: 'Configuration &arechargée&7.'
  ouvert: 'Dialogue &e{dialogue} &7ouvert pour &e{joueur}&7.'

info:
  menu-redemarrage: 'L''aspect du menu SkyHand a changé : il ne sera mis à jour qu''au &eprochain redémarrage&7.'
  # {charges} et {erreurs} : nombre de dialogues chargés et en erreur
  reload-bilan: '&e{charges}&7 dialogue(s) chargé(s), &e{erreurs}&7 en erreur.'
  list-titre: 'Menu et dialogues de &eSHDialogs&7 :'
  # {boutons}, {echap} et {rapides} (oui ou non)
  list-menu: 'Menu SkyHand : &e{boutons}&7 boutons, écran Échap {echap}, actions rapides {rapides}.'
  list-menu-desactive: 'Menu SkyHand : &edésactivé&7.'
  list-vide: 'Aucun dialogue dans la section &edialogues&7 du config.yml.'
  # {dialogue}, {titre}, {boutons}, {permission} et {fichier} (config.yml ou fichier du dossier dialogues)
  list-dialogue: '&a{dialogue} &7: {titre} &7({boutons} boutons, permission : {permission}, {fichier})'
  list-desactive: '&e{dialogue} &7: désactivé (&eactif: false&7)'

avertissement:
  # Même texte que info.reload-bilan, utilisé quand au moins un dialogue est en erreur
  reload-bilan: '&e{charges}&7 dialogue(s) chargé(s), &c{erreurs}&7 en erreur.'
  # Client sans dialogues (avant la 1.21.6) : pas de repli, les menus DeluxeMenus gardent leur texte classique.
  # version-ancienne va au joueur, qu'il ouvre le dialogue lui-même ou qu'un PNJ, un menu ou la console l'ouvre pour lui
  # (au plus une fois toutes les 3 secondes) ; version-ancienne-autre au membre du staff qui l'ouvre pour lui.
  version-ancienne: 'Ta version de Minecraft est trop ancienne pour ce dialogue. Mets ton jeu à jour en &61.21.6 &7ou plus récent pour en profiter.'
  version-ancienne-autre: 'Le joueur &e{joueur} &7ne gère pas les dialogues (&e1.21.6 &7minimum).'
  # Identifiant défini deux fois : le premier lu est gardé.
  # {dialogue}, {fichier} (celui qui est ignoré) et {premier} (celui qui est gardé)
  reload-doublon: '&c{dialogue} &7est défini deux fois, celui de &e{fichier} &7est ignoré et celui de &e{premier} &7est gardé.'
  list-doublon: '&c{dialogue} &7est en doublon, celui de &e{fichier} &7est ignoré (déjà défini dans &e{premier}&7).'
