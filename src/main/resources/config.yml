# SHDialogs - dialogues du serveur (Dialog API, clients 1.21.6 et plus)
#
# 1. Menu SkyHand : un dialogue enregistré dans le registre du serveur au démarrage (clé skyhand:menu) et ajouté aux
#    tags PAUSE_SCREEN_ADDITIONS (bouton dans l'écran Échap) et QUICK_ACTIONS (touche « actions rapides » du client).
#    ATTENTION : l'aspect du menu (titres, textes, libellés, infobulles, colonnes, liste des boutons) est figé au
#    démarrage du serveur. /shdialogs reload ne recharge que les commandes, les permissions et les messages.
# 2. /signaler : formulaire de signalement (pseudo, motif, détails) qui lance /report, la commande de TigerReports.
#
# Codes de couleur : &a, &l... et &#rrggbb. Chaque commande est exécutée PAR LE JOUEUR, jamais par la console.

# Préfixe des messages du chat. {couleur} est remplacé par la couleur du type de message (voir plus bas).
prefixe: '&7&l« &{couleur}&lSH &8&l» &7'
couleurs:
  erreur: 'c'
  succes: 'a'
  info: 'e'

# ---------------------------------------------------------------------------------------------------------------
# Menu SkyHand
# ---------------------------------------------------------------------------------------------------------------
menu:
  actif: true
  # Bouton « Menu SkyHand » dans l'écran Échap
  ecran-echap: true
  # Entrée dans les actions rapides du client
  actions-rapides: true
  titre: '&e&lMenu SkyHand'
  # Texte du bouton dans l'écran Échap et dans la liste des actions rapides
  titre-bouton: '&e&lMenu SkyHand'
  texte:
    - '&7Raccourcis vers les principaux menus de &eSkyHand&7.'
  colonnes: 2
  largeur-bouton: 150
  bouton-fermer: '&7Fermer'
  # Chaque bouton lance UNE commande joueur (sans le /). Les boutons sont affichés dans cet ordre.
  #   libelle    : texte du bouton
  #   infobulle  : lignes affichées au survol (facultatif)
  #   commande   : commande lancée par le joueur, comme s'il la tapait dans le chat
  #   url        : à la place de commande, ouvre une adresse http(s) (le client demande confirmation)
  #   permission : permission nécessaire (facultatif, vide = tout le monde)
  #   actif      : false pour masquer le bouton
  boutons:
    ile:
      actif: true
      libelle: '&b&lMon île'
      infobulle:
        - '&7Le menu de votre île :'
        - '&7améliorations, paramètres, banque, warps.'
        - ''
        - '&8/is'
      commande: 'is'
      permission: ''
    general:
      actif: true
      libelle: '&6&lMenu général'
      infobulle:
        - '&7Boutique, métiers, hôtel des ventes,'
        - '&7collectibles, warps et kits.'
        - ''
        - '&8/is more'
      commande: 'is more'
      permission: ''
    boutique:
      actif: true
      libelle: '&a&lBoutique'
      infobulle:
        - '&7Achetez et vendez des blocs,'
        - '&7des minerais, des aliments...'
        - ''
        - '&8/shop'
      commande: 'shop'
      permission: ''
    metiers:
      actif: true
      libelle: '&2&lMétiers'
      infobulle:
        - '&7Vos métiers, leur niveau et'
        - '&7vos points de métier.'
        - ''
        - '&8/jobs'
      commande: 'jobs'
      permission: ''
    hdv:
      actif: true
      libelle: '&e&lHôtel des ventes'
      infobulle:
        - '&7Ventes directes et enchères'
        - '&7entre joueurs.'
        - ''
        - '&8/hdv'
      commande: 'hdv'
      permission: ''
    quetes:
      actif: true
      libelle: '&d&lQuêtes'
      infobulle:
        - '&7Vos quêtes en cours et leurs récompenses.'
        - ''
        - '&8/quest'
      commande: 'quest'
      permission: ''
    warps:
      actif: true
      libelle: '&9&lWarps'
      infobulle:
        - '&7Arène, 1v1, enchantement, top...'
        - ''
        - '&8/warp'
      commande: 'warp'
      permission: ''
    vote:
      actif: true
      libelle: '&5&lVotes et récompenses'
      infobulle:
        - '&7Récompenses journalières et votes.'
        - ''
        - '&8/vote'
      commande: 'vote'
      permission: ''
    skyhand:
      actif: true
      libelle: '&b&lFonctionnalités uniques'
      infobulle:
        - '&7Ce que SkyHand propose de plus.'
        - ''
        - '&8/skyhand'
      commande: 'skyhand'
      permission: ''
    signaler:
      actif: true
      libelle: '&c&lSignaler un joueur'
      infobulle:
        - '&7Ouvre le formulaire de signalement.'
        - ''
        - '&8/signaler'
      commande: 'signaler'
      permission: ''
    # Liens du serveur : déjà proposés par SHWelcome dans le bouton « Liens du serveur » de l'écran Échap.
    # À activer seulement si vous les voulez aussi dans les actions rapides (ils seront alors en double dans Échap).
    discord:
      actif: false
      libelle: '&9&lDiscord'
      infobulle:
        - '&7Rejoindre le serveur Discord.'
      url: 'https://discord.skyhand.fr'
    site:
      actif: false
      libelle: '&b&lSite web'
      infobulle:
        - '&7skyhand.fr'
      url: 'https://skyhand.fr'
    voter:
      actif: false
      libelle: '&d&lVoter'
      infobulle:
        - '&7Votez pour SkyHand et gagnez des récompenses.'
      url: 'https://skyhand.fr/vote'
    boutique-web:
      actif: false
      libelle: '&a&lBoutique en ligne'
      infobulle:
        - '&7store.skyhand.fr'
      url: 'https://store.skyhand.fr'

# ---------------------------------------------------------------------------------------------------------------
# /signaler
# ---------------------------------------------------------------------------------------------------------------
signalement:
  actif: true
  # Commande lancée par le joueur après toutes les vérifications.
  # Variables : {joueur} (pseudo), {raison} (motif + détails mis en forme), {motif}, {details}
  commande: 'report {joueur} {raison}'
  # Les clients plus anciens que 1.21.6 (protocole 771) ne connaissent pas les dialogues : ils sont renvoyés vers /report.
  # Il faut ViaVersion pour connaître la version du client ; sans lui tout le monde est considéré compatible.
  protocole-minimum: 771
  # Délai minimal entre deux signalements envoyés par le même joueur (TigerReports a son propre délai en plus).
  cooldown-secondes: 30
  # Durée de validité d'un formulaire ouvert : au-delà, ses boutons ne sont plus acceptés.
  expiration-secondes: 600
  # Un pseudo doit correspondre à cette expression, sinon il est refusé
  pseudo-regex: '^[A-Za-z0-9_]{1,16}$'
  pseudo-longueur-max: 16
  # Refuser un pseudo ni connecté ni déjà venu sur le serveur
  refuser-joueur-inconnu: true
  # Détails facultatifs : longueur maximale (contrôlée aussi côté serveur), taille de la zone de saisie
  details-longueur-max: 150
  details-lignes: 4
  details-hauteur: 80
  # Mise en forme de la raison transmise à TigerReports (sans détails, seul le motif est transmis)
  format-raison: '{motif} - {details}'
  raison-longueur-max: 200
  largeur: 260
  titre: '&c&lSignaler un joueur'
  texte:
    - '&7Indiquez le joueur, le motif, puis des détails si besoin.'
    - '&7Un faux signalement peut être sanctionné.'
  champ-joueur: '&7Pseudo du joueur'
  champ-motif: '&7Motif'
  champ-details: '&7Détails (facultatif)'
  bouton-envoyer: '&a&lEnvoyer le signalement'
  infobulle-envoyer:
    - '&7Transmet le signalement à l''équipe'
    - '&7via TigerReports.'
  bouton-annuler: '&7Annuler'
  infobulle-annuler: []
  # Erreurs affichées en rouge en haut du formulaire (les champs saisis sont conservés)
  erreurs:
    pseudo-vide: '&cIndiquez le pseudo du joueur à signaler.'
    pseudo-invalide: '&cCe pseudo n''est pas valide.'
    pseudo-inconnu: '&cLe joueur &f{joueur} &cest introuvable.'
    soi-meme: '&cVous ne pouvez pas vous signaler vous-même.'
    motif-invalide: '&cChoisissez un motif dans la liste.'
    details-trop-longs: '&cLes détails sont trop longs ({max} caractères maximum).'
    raison-trop-longue: '&cLe signalement est trop long, raccourcissez les détails.'
  # Motifs proposés. raison = texte EXACT du motif dans TigerReports (Config.DefaultReasons.ReasonN.Name de son
  # config.yml). Un motif absent de la liste de TigerReports est signalé dans la console au démarrage et au reload.
  motifs:
    - id: 'cheat-fly'
      libelle: '&fCheat (Fly)'
      raison: 'Cheat (Fly)'
    - id: 'cheat-pvp'
      libelle: '&fCheat (PvP)'
      raison: 'Cheat (PvP)'
    - id: 'langage'
      libelle: '&fLangage'
      raison: 'Langage'
    - id: 'spam'
      libelle: '&fSpam'
      raison: 'Spam'
    - id: 'flood'
      libelle: '&fFlood'
      raison: 'Flood'
    - id: 'provocation'
      libelle: '&fProvocation'
      raison: 'Provocation'
    - id: 'pub'
      libelle: '&fPub'
      raison: 'Pub'
    - id: 'arnaque'
      libelle: '&fArnaque'
      raison: 'Arnaque'
    - id: 'vol'
      libelle: '&fVol'
      raison: 'Vol'
    - id: 'bug'
      libelle: '&fUtilisation de bug'
      raison: 'UseBug'
    - id: 'pseudo-skin'
      libelle: '&fPseudo ou skin inapproprié'
      raison: 'Pseudo/skin innapproprié'

# ---------------------------------------------------------------------------------------------------------------
# Messages du chat (sans préfixe : il dépend du type, voir « prefixe » et « couleurs » plus haut)
# ---------------------------------------------------------------------------------------------------------------
messages:
  erreur:
    joueur-seulement: 'Commande réservée aux &cjoueurs&7.'
    permission: 'Vous n''avez pas la permission.'
    usage: 'Utilisation : &e/shdialogs <reload|menu>&7.'
    menu-indisponible: 'Le menu SkyHand n''est pas chargé (voir la console).'
    bouton-indisponible: 'Ce bouton n''est plus disponible.'
    bouton-permission: 'Vous n''avez pas accès à &e{bouton}&7.'
    commande-echec: 'La commande &e/{commande} &7n''a pas pu être lancée.'
    version-ancienne: 'Votre version de Minecraft ne gère pas ce formulaire : utilisez &e/report <joueur> <motif>&7.'
    signalement-desactive: 'Les signalements par formulaire sont &cdésactivés&7.'
    signalement-indisponible: 'Les signalements sont &cindisponibles &7pour le moment.'
    cooldown: 'Patientez encore &e{secondes} s &7avant un nouveau signalement.'
    formulaire-expire: 'Ce formulaire n''est plus valable : relancez &e/signaler&7.'
    ouverture-impossible: 'Le formulaire n''a pas pu s''ouvrir : utilisez &e/report <joueur> <motif>&7.'
    erreur-interne: 'Une erreur est survenue : utilisez &e/report <joueur> <motif>&7.'
  succes:
    recharge: 'Configuration &arechargée&7.'
  info:
    menu-redemarrage: 'L''aspect du menu SkyHand a changé : il ne sera mis à jour qu''au &eprochain redémarrage&7.'
