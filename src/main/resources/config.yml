# SHDialogs - menu SkyHand dans l'écran Échap et les actions rapides (Dialog API, clients 1.21.6 et plus)
#
# Un dialogue enregistré dans le registre du serveur au démarrage (clé skyhand:menu) et ajouté aux tags
# PAUSE_SCREEN_ADDITIONS (bouton dans l'écran Échap) et QUICK_ACTIONS (touche « actions rapides » du client).
# ATTENTION : l'aspect du menu (titres, textes, libellés, infobulles, colonnes, liste des boutons) est figé au
# démarrage du serveur. /shdialogs reload ne recharge que les commandes, les permissions et les messages.
#
# Dialogues à la demande (section « dialogues », plus bas) : /shdialogs open <dialogue> [joueur] [valeurs...] en ouvre un depuis un
# menu DeluxeMenus (« [player] shdialogs open vote », à la suite du texte classique du menu), une commande, un NPC...
# Ils sont construits à l'exécution : /shdialogs reload les recharge, sans redémarrage. Les clients plus anciens que la
# 1.21.6 ne les voient pas : ils reçoivent seulement un avertissement.
#
# Dossier dialogues : chaque fichier .yml de plugins/SHDialogs/dialogues/ (sous-dossiers compris) ajoute des dialogues, écrits
# à la racine du fichier, avec le même format que la section « dialogues » de ce fichier (une clé par dialogue, c'est son
# identifiant). Un identifiant déjà défini est refusé : le premier lu gagne (ce fichier, puis les fichiers du dossier par ordre
# alphabétique de chemin) et le doublon est signalé par /shdialogs reload et /shdialogs list. /shdialogs reload relit aussi le
# dossier ; un fichier illisible empêche le rechargement et est nommé.
#
# Dépendance facultative : PlaceholderAPI, pour les placeholders %...% des textes et des conditions des dialogues.
#
# Commandes (la console peut utiliser reload, list et open avec un joueur) :
#   /shdialogs reload                         Relit ce fichier, messages.yml et le dossier dialogues. Si l'un d'eux est invalide,
#                                             rien n'est remplacé et le fichier fautif est indiqué.
#   /shdialogs list                           Liste le menu et les dialogues : chargés (avec leur fichier), désactivés, en doublon
#                                             ou en erreur (avec la cause).
#   /shdialogs menu                           Ouvre le menu SkyHand à soi-même (test, joueur seulement).
#   /shdialogs open <dialogue> [joueur]       Ouvre un dialogue à soi-même, ou à un autre joueur.
#   /shdialogs open <dialogue> <joueur> <valeurs...>
#                                             Avec les valeurs {1}, {2}... du dialogue (console et staff, voir plus bas).
#
# Permissions :
#   shdialogs.admin          Toutes les sous-commandes d'administration (par défaut : op).
#   shdialogs.admin.reload   /shdialogs reload (par défaut : op).
#   shdialogs.admin.list     /shdialogs list (par défaut : op).
#   shdialogs.menu           /shdialogs menu (par défaut : op).
#   shdialogs.open           /shdialogs open pour soi-même (par défaut : tous les joueurs).
#   shdialogs.open.others    /shdialogs open pour un autre joueur, avec des valeurs, ou d'un dialogue qui a un bouton
#                            [console] (par défaut : op).
#   Le champ permission d'un bouton ou d'un dialogue accepte n'importe quel nœud ; vide, il est ouvert à tous.
#
# Les messages du chat (préfixe, couleurs, textes) sont dans messages.yml.
#
# Codes de couleur : &a, &l... et &#rrggbb. Une commande est exécutée PAR LE JOUEUR ; seuls les dialogues de la section
# « dialogues » peuvent en lancer par la console ([console], voir plus bas).
#
# Charte de rendu (même esprit que les menus DeluxeMenus du serveur) :
#   - le titre est en tête du texte, sur deux lignes : « SkyHand » à la couleur du dialogue, puis le titre en blanc ; la barre
#     de titre reste vide, l'icône d'avertissement du client y est seule ;
#   - le joueur est aveuglé tant que le dialogue est affiché (voir aveugler-pendant-dialogues) : le fond est noir ;
#   - &8 est lisible pour les cadres « » du titre et du texte ;
#   - les BOUTONS ont un fond gris moyen : jamais de &8 ni de &0 dans un libellé de bouton, couleurs claires ou blanc ;
#   - les infobulles ont le fond sombre des infobulles du jeu : &8 y est lisible.

# Effet Cécité tant qu'un dialogue de ce plugin est affiché : le texte se lit sur fond noir. Il est retiré dès que le joueur
# clique un bouton du dialogue (ou Échap quand il a un bouton en bas), sinon dès qu'il tourne la caméra, se déplace ou ouvre un inventaire.
# Un joueur déjà aveugle pour une autre raison n'est pas touché. Le menu ouvert depuis l'écran Échap ne passe pas par le
# serveur : il n'est pas concerné.
aveugler-pendant-dialogues: true

# ---------------------------------------------------------------------------------------------------------------
# Menu SkyHand
# ---------------------------------------------------------------------------------------------------------------
menu:
  actif: true
  # Bouton « Menu SkyHand » dans l'écran Échap
  ecran-echap: true
  # Entrée dans les actions rapides du client
  actions-rapides: true
  # Titre en tête du texte, une ligne par entrée : « SkyHand » à la couleur du dialogue, puis le titre en blanc
  titre:
    - '&7&l« &e&lSkyHand &8&l»'
    - '&fMenu du serveur'
  # Texte du bouton dans l'écran Échap et dans la liste des actions rapides (court, lisible sur fond gris)
  titre-bouton: '&eMenu SkyHand'
  texte:
    - '&7Accédez en un clic aux &emenus principaux &7du serveur.'
    - '&7&oAstuce : survolez un bouton pour voir sa commande.'
  colonnes: 2
  largeur-bouton: 150
  bouton-fermer: '&c⤾ &fFermer'
  # Chaque bouton lance une commande joueur (sans le /). Les boutons sont affichés dans cet ordre, sur 2 colonnes
  # (gardez un nombre PAIR de boutons actifs). Une couleur par thème : &b navigation, &a économie, &d progression.
  #   libelle    : texte du bouton, d'UNE couleur et sans gras
  #   infobulle  : lignes affichées au survol (facultatif) : phrase encadrée, commande, invitation au clic
  #   commande   : commande lancée par le joueur, comme s'il la tapait dans le chat (ou une liste, avec des lignes
  #                [message] ; pas de [console] dans le menu : il s'ouvre depuis l'écran Échap, sans passer par le serveur)
  #   url        : à la place de commande, ouvre une adresse http(s) (le client demande confirmation)
  #   fermer     : true à la place de commande et url, le bouton ferme simplement le dialogue
  #   permission : permission nécessaire (facultatif, vide = tout le monde)
  #   actif      : false pour masquer le bouton
  boutons:
    # --- Navigation
    spawn:
      actif: true
      libelle: '&bSpawn'
      infobulle:
        - '&8&l« &7Retournez au &bspawn &7du serveur &8&l»'
        - ''
        - '&7&nCommande:&b /spawn'
        - ''
        - '&7&o(( &b&oCliquez pour y aller &7&o))'
      commande: 'spawn'
      permission: ''
    # --- Économie
    boutique:
      actif: true
      libelle: '&aBoutique'
      infobulle:
        - '&8&l« &aAchetez &7et &avendez &7des blocs,'
        - '&7des minerais, des aliments... &8&l»'
        - ''
        - '&7&nCommande:&a /shop'
        - ''
        - '&7&o(( &a&oCliquez pour ouvrir &7&o))'
      commande: 'shop'
      permission: ''
    # Liens du serveur : l'écran Échap n'accepte qu'un seul bouton de dialogue, c'est donc ce menu qui les propose.
    # Gardez un nombre pair de boutons actifs : désactivez-les par deux.
    discord:
      actif: true
      libelle: '&9Discord'
      infobulle:
        - '&8&l« &7Rejoignez le serveur &9Discord &8&l»'
        - ''
        - '&7&nLien:&9 example.com/discord'
        - ''
        - '&7&o(( &9&oCliquez pour ouvrir &7&o))'
      url: 'https://example.com/discord'
    site:
      actif: true
      libelle: '&bSite web'
      infobulle:
        - '&8&l« &7Le &bsite &7du serveur &8&l»'
        - ''
        - '&7&nLien:&b example.com'
        - ''
        - '&7&o(( &b&oCliquez pour ouvrir &7&o))'
      url: 'https://example.com'

# ---------------------------------------------------------------------------------------------------------------
# Dialogues à la demande : /shdialogs open <dialogue> [joueur] [valeurs...]
# ---------------------------------------------------------------------------------------------------------------
# Chaque dialogue a un titre (une ou plusieurs lignes, en tête du texte), un texte (lignes) et des boutons (mêmes champs que
# menu.boutons : libelle, infobulle, url, commande ou fermer, permission, actif). En option : colonnes (1), largeur-bouton
# (200), bouton-fermer (bouton tout en bas ; '' = aucun, Échap ferme toujours le dialogue), permission (du dialogue entier)
# et actif. Une seule adresse par site : changez-la ici, tous les menus qui ouvrent le dialogue la suivent.
#
# commande d'un bouton : une ligne, ou une liste de lignes lancées dans l'ordre. Chaque ligne :
#   sans préfixe, ou « [player] ... »   commande lancée par le joueur, comme s'il la tapait dans le chat ;
#   « [console] ... »                   commande lancée par la console. Un dialogue qui en a ne s'ouvre que par la console ou le
#                                       staff (shdialogs.open.others), et chaque ouverture ne sert qu'à un clic ;
#   « [message] ... »                   message envoyé dans le chat du joueur.
# Valeurs : « /shdialogs open <dialogue> <joueur> <valeur 1> <valeur 2>... » remplace {1}, {2}... dans le titre, le texte,
# les libellés, les infobulles et les commandes ; la dernière valeur prend le reste de la ligne (espaces et couleurs
# compris). {joueur} est le pseudo du joueur. Des valeurs ne se donnent que par la console ou le staff (shdialogs.open.others) :
# un dialogue qui attend {1} ne s'ouvre pas sans elles.
# attendre-menu: true : si le joueur a un menu ouvert (le lot d'une box...), le dialogue s'affiche quand il le ferme (dans
# les 2 minutes) au lieu de fermer le menu.
#
# Placeholders PlaceholderAPI : %...% est remplacé pour le joueur qui reçoit le dialogue, à l'ouverture, dans titre, texte,
# libelle, infobulle, bouton-fermer, champ (libelle et defaut) et dans les valeurs des conditions. {1}, {2}... et {joueur} sont
# remplacés d'abord. Sans PlaceholderAPI le texte reste tel quel. Les commandes ne reçoivent pas de placeholders : utilisez {joueur}.
#
# Conditions : une condition s'écrit « A opérateur B », avec un de ces opérateurs :
#   ==  !=                 égal, différent
#   >=  <=  >  <           plus grand ou égal, plus petit ou égal, plus grand, plus petit (sur des nombres)
#   contient  !contient    A contient B, A ne contient pas B (sur du texte)
# A et B reçoivent d'abord {1}, {joueur}... (et {saisie} dans exige) puis les placeholders. Si A et B se lisent comme des nombres
# (espaces et séparateurs de milliers ignorés, virgule ou point décimal : « 300 000 », « 1,5 », « 1.000.000 »), ils sont
# comparés comme des nombres. Sinon le texte est comparé sans codes couleur, sans tenir compte de la casse ni des accents, et
# >=, <=, > et < sont faux. Une liste de conditions est vraie quand toutes le sont.
#
# versions : remplace une partie du dialogue selon le joueur. Une clé par version (son nom), dans l'ordre. Chaque version a
# des conditions (si, obligatoires) et peut remplacer titre, texte, boutons (tous à la fois), bouton-fermer, colonnes,
# largeur-bouton et champ (false pour le retirer) ; tout le reste vient du dialogue. À l'ouverture, la première version dont
# toutes les conditions sont vraies est montrée, sinon le dialogue lui-même. Au clic, le bouton est cherché dans la version
# montrée à ce joueur.
#
# champ : ajoute un champ où le joueur tape un texte. Clés : libelle (texte au-dessus du champ), defaut (texte de départ, vide
# par défaut), longueur-max (nombre de caractères au plus, 32 par défaut). Les commandes, messages et conditions des boutons
# peuvent contenir {saisie} : le texte tapé, nettoyé. On ne garde que les lettres (accents compris), les chiffres, les espaces,
# les apostrophes et les traits d'union ; les espaces multiples sont réduits à un et le texte est coupé à longueur-max.
# Rien d'autre n'entre dans une commande. Sans champ, {saisie} est vide. Ne placez jamais {saisie} en début de commande.
#
# exige : un bouton peut demander des objets et des conditions avant de lancer sa commande. Clés :
#   objets   liste de « MATERIAL:quantité » ou « #tag_minecraft:quantité » (« #minecraft:logs:4 »). Seuls comptent les objets
#            normaux, sans nom personnalisé, sans lore, sans enchantement ni données de plugin : un objet renommé n'est
#            ni compté ni retiré.
#   si       conditions, comme ci-dessus
#   refus    lignes lancées si l'exigence n'est pas remplie (mêmes préfixes que commande : [player], [console], [message]) ;
#            vide, le joueur reçoit un message d'erreur simple
# Quand toutes les conditions sont vraies et que l'inventaire contient les objets, ils sont retirés puis la commande du bouton
# est lancée, dans le même tick, sur le scheduler du joueur ; sinon seules les lignes de refus sont lancées et rien n'est retiré.
# Un [console] dans refus compte comme un [console] de commande (dialogue ouvert par la console ou le staff, une fois par ouverture).
#
# Exemple, à placer dans un fichier du dossier dialogues (à la racine) ou ici sous « dialogues: » :
#   troc:
#     titre:
#       - '&7&l« &d&lSkyHand &8&l»'
#       - '&fLe troqueur'
#     texte:
#       - '&7Donnez-moi &e3 bouteilles de miel &7et &e4 bûches&7.'
#     champ:
#       libelle: '&7Votre nom de marchand'
#       longueur-max: 16
#     bouton-fermer: ''
#     boutons:
#       echanger:
#         libelle: '&a&lÉchanger'
#         exige:
#           objets:
#             - 'HONEY_BOTTLE:3'
#             - '#minecraft:logs:4'
#           si:
#             - '%player_level% >= 10'
#           refus:
#             - '[message] &8&l« &c&lSH &8&l» &7Il vous manque &cquelque chose&7.'
#         commande:
#           - '[console] give {joueur} diamond 1'
#           - '[message] &8&l« &a&lSH &8&l» &7Merci &a{saisie}&7 !'
#       partir:
#         libelle: '&fPartir'
#         fermer: true
#     versions:
#       habitue:
#         si:
#           - '%player_level% >= 30'
#         texte:
#           - '&7Je vous connais bien, même prix que d''habitude.'
dialogues:
  # Cosmétiques gagnés dans une box : la récompense du lot ouvre le dialogue, par exemple
  #   shdialogs open nouveau-compagnon %player_name% Teckel &fCompagnon &6Teckel
  # {1} : ce que la commande du bouton équipe, {2} : le nom affiché (le DisplayName du lot). Le dialogue attend que le
  # menu de la box soit fermé ; « Équiper maintenant » en premier, « Plus tard » ferme.
  nouveau-compagnon:
    titre:
      - '&7&l« &d&lSkyHand &8&l»'
      - '&fNouveau compagnon !'
    texte:
      - '{2} &7est à vous !'
      - '&7Équipez-le maintenant, ou plus tard avec &d/pets&7.'
    attendre-menu: true
    bouton-fermer: ''
    boutons:
      equiper:
        libelle: '&a&lÉquiper maintenant'
        commande:
          - '[console] shcompagnons set {joueur} {1}'
          - '[message] &8&l« &a&lSH &8&l» &7Vous avez équipé : {2}&7.'
      plus-tard:
        libelle: '&fPlus tard'
        fermer: true
  nouvelle-particule:
    titre:
      - '&7&l« &d&lSkyHand &8&l»'
      - '&fNouvelle particule !'
    texte:
      - '{2} &7est à vous !'
      - '&7Équipez-la maintenant, ou plus tard avec &d/particules&7.'
    attendre-menu: true
    bouton-fermer: ''
    boutons:
      equiper:
        libelle: '&a&lÉquiper maintenant'
        commande:
          - '[console] ppo {joueur} group load {1}'
          - '[message] &8&l« &a&lSH &8&l» &7Vous avez équipé : {2}&7.'
      plus-tard:
        libelle: '&fPlus tard'
        fermer: true
  nouveau-titre:
    titre:
      - '&7&l« &d&lSkyHand &8&l»'
      - '&fNouveau titre !'
    texte:
      - '{2} &7est à vous !'
      - '&7Équipez-le maintenant, ou plus tard avec &d/titres&7.'
    attendre-menu: true
    bouton-fermer: ''
    boutons:
      equiper:
        libelle: '&a&lÉquiper maintenant'
        commande:
          - '[console] shtitres set {joueur} {1}'
          - '[message] &8&l« &a&lSH &8&l» &7Vous avez équipé : {2}&7.'
      plus-tard:
        libelle: '&fPlus tard'
        fermer: true
  vote:
    titre:
      - '&7&l« &d&lSkyHand &8&l»'
      - '&fVoter pour le serveur'
    texte:
      - '&7Votez pour le serveur sur nos sites partenaires et'
      - '&7gagnez des &drécompenses&7.'
    boutons:
      voter:
        libelle: '&dVoter maintenant'
        infobulle:
          - '&8&l« &7Choisissez un site de vote puis'
          - '&7validez votre &dvote &8&l»'
          - ''
          - '&7&nLien:&d example.com/vote'
          - ''
          - '&7&o(( &d&oCliquez pour ouvrir &7&o))'
        url: 'https://example.com/vote'
  # Accueil des nouveaux joueurs : à ouvrir à leur arrivée, par exemple depuis un kit d'arrivée avec
  # « shdialogs open bienvenue <joueur> ». Les clients plus anciens que la 1.21.6 ne le voient pas.
  bienvenue:
    titre:
      - '&7&l« &e&lSkyHand &8&l»'
      - '&fBienvenue sur le serveur !'
    texte:
      - '&aVotre aventure commence ici !'
      - '&7Prenez le temps de lire le &erèglement &7du serveur,'
      - '&7puis lancez-vous : le &espawn &7vous attend.'
      - ''
      - '&aC''est parti &7: vous commencez à jouer.'
      - '&bRèglement &7: les règles du serveur.'
    # Pas de bouton en bas : « C'est parti », en premier, ferme le dialogue
    bouton-fermer: ''
    boutons:
      parti:
        libelle: '&a&lC''est parti !'
        infobulle:
          - '&8&l« &7Commencer à jouer &8&l»'
          - ''
          - '&7&o(( &a&oCliquez pour fermer &7&o))'
        fermer: true
      reglement:
        libelle: '&bRèglement'
        infobulle:
          - '&8&l« &7Les règles du serveur &8&l»'
          - ''
          - '&7&o(( &b&oCliquez pour lire &7&o))'
        commande: 'shdialogs open reglement'
  # Suite de « bienvenue » (bouton « Règlement ») : un bouton lance une commande, un autre ouvre une adresse.
  reglement:
    titre:
      - '&7&l« &b&lSkyHand &8&l»'
      - '&fRèglement'
    texte:
      - '&7Le &brèglement complet &7du serveur est consultable sur'
      - '&7le site. Merci de le respecter.'
    bouton-fermer: '&a&lCompris'
    boutons:
      lire:
        libelle: '&bLire le règlement'
        infobulle:
          - '&8&l« &7Règles générales et règles du jeu &8&l»'
          - ''
          - '&7&nLien:&b example.com/reglement'
          - ''
          - '&7&o(( &b&oCliquez pour ouvrir &7&o))'
        url: 'https://example.com/reglement'
      retour:
        libelle: '&eRetour'
        commande: 'shdialogs open bienvenue'
