# SHDialogs - menu SkyHand dans l'écran Échap et les actions rapides (Dialog API, clients 1.21.6 et plus)
#
# Un dialogue enregistré dans le registre du serveur au démarrage (clé skyhand:menu) et ajouté aux tags
# PAUSE_SCREEN_ADDITIONS (bouton dans l'écran Échap) et QUICK_ACTIONS (touche « actions rapides » du client).
# ATTENTION : l'aspect du menu (titres, textes, libellés, infobulles, colonnes, liste des boutons) est figé au
# démarrage du serveur. /shdialogs reload ne recharge que les commandes, les permissions et les messages.
#
# Codes de couleur : &a, &l... et &#rrggbb. Chaque commande est exécutée PAR LE JOUEUR, jamais par la console.
#
# Charte de rendu (même esprit que les menus DeluxeMenus du serveur) :
#   - le fond du dialogue est sombre : &8 est lisible pour les cadres « » du titre et du texte ;
#   - les BOUTONS ont un fond gris moyen : jamais de &8 ni de &0 dans un libellé de bouton, couleurs claires ou blanc ;
#   - les infobulles ont le fond sombre des infobulles du jeu : &8 y est lisible.

# Préfixe des messages du chat. {couleur} est remplacé par la couleur du type de message (voir plus bas).
prefixe: '&7&l« &{couleur}&lSH &8&l» &7'
couleurs:
  erreur: 'c'
  succes: 'a'
  info: 'e'

# ---------------------------------------------------------------------------------------------------------------
# Menu SkyHand
# ---------------------------------------------------------------------------------------------------------------
menu:
  actif: true
  # Bouton « Menu SkyHand » dans l'écran Échap
  ecran-echap: true
  # Entrée dans les actions rapides du client
  actions-rapides: true
  titre: '&7&l« &e&lSkyHand &8&l» &7Menu'
  # Texte du bouton dans l'écran Échap et dans la liste des actions rapides (court, lisible sur fond gris)
  titre-bouton: '&eMenu SkyHand'
  texte:
    - '&7Accédez en un clic aux &emenus principaux &7de &eSkyHand&7.'
    - '&7&oAstuce : survolez un bouton pour voir sa commande.'
  colonnes: 2
  largeur-bouton: 150
  bouton-fermer: '&c⤾ &fFermer'
  # Chaque bouton lance UNE commande joueur (sans le /). Les boutons sont affichés dans cet ordre, sur 2 colonnes
  # (gardez un nombre PAIR de boutons actifs). Une couleur par thème : &b navigation, &a économie, &d progression.
  #   libelle    : texte du bouton, d'UNE couleur et sans gras
  #   infobulle  : lignes affichées au survol (facultatif) : phrase encadrée, commande, invitation au clic
  #   commande   : commande lancée par le joueur, comme s'il la tapait dans le chat
  #   url        : à la place de commande, ouvre une adresse http(s) (le client demande confirmation)
  #   permission : permission nécessaire (facultatif, vide = tout le monde)
  #   actif      : false pour masquer le bouton
  boutons:
    # --- Navigation
    ile:
      actif: true
      libelle: '&bMon île'
      infobulle:
        - '&8&l« &7Gérez votre &bîle &7: améliorations,'
        - '&7paramètres, &bbanque &7et &bwarps &8&l»'
        - ''
        - '&7&nCommande:&b /is'
        - ''
        - '&7&o(( &b&oCliquez pour ouvrir &7&o))'
      commande: 'is'
      permission: ''
    general:
      actif: true
      libelle: '&bMenu général'
      infobulle:
        - '&8&l« &7Le &bmenu général &7: boutique,'
        - '&7métiers, ventes, collectibles,'
        - '&bwarps &7et &bkits &8&l»'
        - ''
        - '&7&nCommande:&b /is more'
        - ''
        - '&7&o(( &b&oCliquez pour ouvrir &7&o))'
      commande: 'is more'
      permission: ''
    warps:
      actif: true
      libelle: '&bWarps'
      infobulle:
        - '&8&l« &bArène&7, &b1v1&7, &benchantement&7,'
        - "&7top et bien d'autres &bwarps &8&l»"
        - ''
        - '&7&nCommande:&b /warp'
        - ''
        - '&7&o(( &b&oCliquez pour ouvrir &7&o))'
      commande: 'warp'
      permission: ''
    # Menu DeluxeMenus « Règlement du SkyBlock » : règles générales, chat, cheats/mods, autres et règles du SkyBlock
    reglement:
      actif: true
      libelle: '&bRèglement'
      infobulle:
        - '&8&l« &7Consultez les &brègles générales'
        - '&7du serveur et celles du &bSkyBlock &8&l»'
        - ''
        - '&7&nCommande:&b /regles'
        - ''
        - '&7&o(( &b&oCliquez pour ouvrir &7&o))'
      commande: 'regles'
      permission: ''
    # --- Économie
    boutique:
      actif: true
      libelle: '&aBoutique'
      infobulle:
        - '&8&l« &aAchetez &7et &avendez &7des blocs,'
        - '&7des minerais, des aliments... &8&l»'
        - ''
        - '&7&nCommande:&a /shop'
        - ''
        - '&7&o(( &a&oCliquez pour ouvrir &7&o))'
      commande: 'shop'
      permission: ''
    metiers:
      actif: true
      libelle: '&aMétiers'
      infobulle:
        - '&8&l« &7Consultez vos &amétiers&7, leur'
        - '&7niveau et vos &apoints de métier &8&l»'
        - ''
        - '&7&nCommande:&a /jobs'
        - ''
        - '&7&o(( &a&oCliquez pour ouvrir &7&o))'
      commande: 'jobs'
      permission: ''
    hdv:
      actif: true
      libelle: '&aHôtel des ventes'
      infobulle:
        - '&8&l« &aVentes directes &7et &aenchères'
        - '&7entre joueurs &8&l»'
        - ''
        - '&7&nCommande:&a /hdv'
        - ''
        - '&7&o(( &a&oCliquez pour ouvrir &7&o))'
      commande: 'hdv'
      permission: ''
    # --- Progression
    quetes:
      actif: true
      libelle: '&dQuêtes'
      infobulle:
        - '&8&l« &7Suivez vos &dquêtes &7en cours'
        - '&7et leurs &drécompenses &8&l»'
        - ''
        - '&7&nCommande:&d /quest'
        - ''
        - '&7&o(( &d&oCliquez pour ouvrir &7&o))'
      commande: 'quest'
      permission: ''
    vote:
      actif: true
      libelle: '&dVotes et récompenses'
      infobulle:
        - '&8&l« &dRécompenses journalières &7et'
        - '&dvotes &7pour SkyHand &8&l»'
        - ''
        - '&7&nCommande:&d /vote'
        - ''
        - '&7&o(( &d&oCliquez pour ouvrir &7&o))'
      commande: 'vote'
      permission: ''
    skyhand:
      actif: true
      libelle: '&dFonctionnalités uniques'
      infobulle:
        - '&8&l« &7Découvrez tout ce que &dSkyHand'
        - '&7propose de plus &8&l»'
        - ''
        - '&7&nCommande:&d /skyhand'
        - ''
        - '&7&o(( &d&oCliquez pour ouvrir &7&o))'
      commande: 'skyhand'
      permission: ''
    # Liens du serveur : déjà proposés par SHWelcome dans le bouton « Liens du serveur » de l'écran Échap.
    # À activer seulement si vous les voulez aussi dans les actions rapides (ils seront alors en double dans Échap).
    # Gardez un nombre pair de boutons actifs : activez-les par deux.
    discord:
      actif: false
      libelle: '&9Discord'
      infobulle:
        - '&8&l« &7Rejoignez le serveur &9Discord &8&l»'
        - ''
        - '&7&nLien:&9 discord.skyhand.fr'
        - ''
        - '&7&o(( &9&oCliquez pour ouvrir &7&o))'
      url: 'https://discord.skyhand.fr'
    site:
      actif: false
      libelle: '&bSite web'
      infobulle:
        - '&8&l« &7Le &bsite &7de SkyHand &8&l»'
        - ''
        - '&7&nLien:&b skyhand.fr'
        - ''
        - '&7&o(( &b&oCliquez pour ouvrir &7&o))'
      url: 'https://skyhand.fr'
    voter:
      actif: false
      libelle: '&dVoter'
      infobulle:
        - '&8&l« &7Votez pour &dSkyHand &7et gagnez'
        - '&7des &drécompenses &8&l»'
        - ''
        - '&7&nLien:&d skyhand.fr/vote'
        - ''
        - '&7&o(( &d&oCliquez pour ouvrir &7&o))'
      url: 'https://skyhand.fr/vote'
    boutique-web:
      actif: false
      libelle: '&aBoutique en ligne'
      infobulle:
        - '&8&l« &7La &aboutique en ligne &7de SkyHand &8&l»'
        - ''
        - '&7&nLien:&a store.skyhand.fr'
        - ''
        - '&7&o(( &a&oCliquez pour ouvrir &7&o))'
      url: 'https://store.skyhand.fr'

# ---------------------------------------------------------------------------------------------------------------
# Messages du chat (sans préfixe : il dépend du type, voir « prefixe » et « couleurs » plus haut)
# ---------------------------------------------------------------------------------------------------------------
messages:
  erreur:
    joueur-seulement: 'Commande réservée aux &cjoueurs&7.'
    permission: 'Vous n''avez pas la permission.'
    usage: 'Utilisation : &e/shdialogs <reload|menu>&7.'
    menu-indisponible: 'Le menu SkyHand n''est pas chargé (voir la console).'
    bouton-indisponible: 'Ce bouton n''est plus disponible.'
    bouton-permission: 'Vous n''avez pas accès à &e{bouton}&7.'
    commande-echec: 'La commande &e/{commande} &7n''a pas pu être lancée.'
    version-ancienne: 'Votre version de Minecraft ne gère pas ce menu : il faut la &e1.21.6 &7ou plus.'
    erreur-interne: 'Une erreur est survenue : réessayez, ou prévenez un membre du &cstaff&7.'
  succes:
    recharge: 'Configuration &arechargée&7.'
  info:
    menu-redemarrage: 'L''aspect du menu SkyHand a changé : il ne sera mis à jour qu''au &eprochain redémarrage&7.'
