# SHDialogs - menu SkyHand dans l'écran Échap et les actions rapides (Dialog API, clients 1.21.6 et plus)
#
# Un dialogue enregistré dans le registre du serveur au démarrage (clé skyhand:menu) et ajouté aux tags
# PAUSE_SCREEN_ADDITIONS (bouton dans l'écran Échap) et QUICK_ACTIONS (touche « actions rapides » du client).
# ATTENTION : l'aspect du menu (titres, textes, libellés, infobulles, colonnes, liste des boutons) est figé au
# démarrage du serveur. /shdialogs reload ne recharge que les commandes, les permissions et les messages.
#
# Dialogues à la demande (section « dialogues », plus bas) : /shdialogs open <dialogue> [joueur] en ouvre un depuis un
# menu DeluxeMenus (« [player] shdialogs open vote », à la suite du texte classique du menu), une commande, un NPC...
# Ils sont construits à l'exécution : /shdialogs reload les recharge, sans redémarrage. Les clients plus anciens que la
# 1.21.6 ne les voient pas : ils reçoivent seulement un avertissement.
#
# Commandes (la console peut utiliser reload, list et open avec un joueur) :
#   /shdialogs reload                         Relit ce fichier et messages.yml. Si l'un des deux est invalide, rien n'est
#                                             remplacé et le fichier fautif est indiqué.
#   /shdialogs list                           Liste le menu et les dialogues : chargés, désactivés ou en erreur (avec la cause).
#   /shdialogs menu                           Ouvre le menu SkyHand à soi-même (test, joueur seulement).
#   /shdialogs open <dialogue> [joueur]       Ouvre un dialogue à soi-même, ou à un autre joueur.
#
# Permissions :
#   shdialogs.admin          Toutes les sous-commandes d'administration (par défaut : op).
#   shdialogs.admin.reload   /shdialogs reload (par défaut : op).
#   shdialogs.admin.list     /shdialogs list (par défaut : op).
#   shdialogs.menu           /shdialogs menu (par défaut : op).
#   shdialogs.open           /shdialogs open pour soi-même (par défaut : tous les joueurs).
#   shdialogs.open.others    /shdialogs open pour un autre joueur (par défaut : op).
#   Le champ permission d'un bouton ou d'un dialogue accepte n'importe quel nœud ; vide, il est ouvert à tous.
#
# Les messages du chat (préfixe, couleurs, textes) sont dans messages.yml.
#
# Codes de couleur : &a, &l... et &#rrggbb. Chaque commande est exécutée PAR LE JOUEUR, jamais par la console.
#
# Charte de rendu (même esprit que les menus DeluxeMenus du serveur) :
#   - le titre est la première ligne du texte : la barre de titre reste vide, l'icône d'avertissement du client y est seule ;
#   - le joueur est aveuglé tant que le dialogue est affiché (voir aveugler-pendant-dialogues) : le fond est noir ;
#   - &8 est lisible pour les cadres « » du titre et du texte ;
#   - les BOUTONS ont un fond gris moyen : jamais de &8 ni de &0 dans un libellé de bouton, couleurs claires ou blanc ;
#   - les infobulles ont le fond sombre des infobulles du jeu : &8 y est lisible.

# Effet Cécité tant qu'un dialogue de ce plugin est affiché : le texte se lit sur fond noir. Il est retiré dès que le joueur
# tourne la caméra, se déplace ou ouvre un inventaire (le client ne prévient pas le serveur quand il ferme un dialogue).
# Un joueur déjà aveugle pour une autre raison n'est pas touché. Le menu ouvert depuis l'écran Échap ne passe pas par le
# serveur : il n'est pas concerné.
aveugler-pendant-dialogues: true

# ---------------------------------------------------------------------------------------------------------------
# Menu SkyHand
# ---------------------------------------------------------------------------------------------------------------
menu:
  actif: true
  # Bouton « Menu SkyHand » dans l'écran Échap
  ecran-echap: true
  # Entrée dans les actions rapides du client
  actions-rapides: true
  titre: '&7&l« &e&lSkyHand &8&l» &7Menu'
  # Texte du bouton dans l'écran Échap et dans la liste des actions rapides (court, lisible sur fond gris)
  titre-bouton: '&eMenu SkyHand'
  texte:
    - '&7Accédez en un clic aux &emenus principaux &7de &eSkyHand&7.'
    - '&7&oAstuce : survolez un bouton pour voir sa commande.'
  colonnes: 2
  largeur-bouton: 150
  bouton-fermer: '&c⤾ &fFermer'
  # Chaque bouton lance UNE commande joueur (sans le /). Les boutons sont affichés dans cet ordre, sur 2 colonnes
  # (gardez un nombre PAIR de boutons actifs). Une couleur par thème : &b navigation, &a économie, &d progression.
  #   libelle    : texte du bouton, d'UNE couleur et sans gras
  #   infobulle  : lignes affichées au survol (facultatif) : phrase encadrée, commande, invitation au clic
  #   commande   : commande lancée par le joueur, comme s'il la tapait dans le chat
  #   url        : à la place de commande, ouvre une adresse http(s) (le client demande confirmation)
  #   fermer     : true à la place de commande et url, le bouton ferme simplement le dialogue
  #   permission : permission nécessaire (facultatif, vide = tout le monde)
  #   actif      : false pour masquer le bouton
  boutons:
    # --- Navigation
    ile:
      actif: true
      libelle: '&bMon île'
      infobulle:
        - '&8&l« &7Gérez votre &bîle &7: améliorations,'
        - '&7paramètres, &bbanque &7et &bwarps &8&l»'
        - ''
        - '&7&nCommande:&b /is'
        - ''
        - '&7&o(( &b&oCliquez pour ouvrir &7&o))'
      commande: 'is'
      permission: ''
    general:
      actif: true
      libelle: '&bMenu général'
      infobulle:
        - '&8&l« &7Le &bmenu général &7: boutique,'
        - '&7métiers, ventes, collectibles,'
        - '&bwarps &7et &bkits &8&l»'
        - ''
        - '&7&nCommande:&b /is more'
        - ''
        - '&7&o(( &b&oCliquez pour ouvrir &7&o))'
      commande: 'is more'
      permission: ''
    warps:
      actif: true
      libelle: '&bWarps'
      infobulle:
        - '&8&l« &bArène&7, &b1v1&7, &benchantement&7,'
        - "&7top et bien d'autres &bwarps &8&l»"
        - ''
        - '&7&nCommande:&b /warp'
        - ''
        - '&7&o(( &b&oCliquez pour ouvrir &7&o))'
      commande: 'warp'
      permission: ''
    # Menu DeluxeMenus « Règlement du SkyBlock » : règles générales, chat, cheats/mods, autres et règles du SkyBlock
    reglement:
      actif: true
      libelle: '&bRèglement'
      infobulle:
        - '&8&l« &7Consultez les &brègles générales'
        - '&7du serveur et celles du &bSkyBlock &8&l»'
        - ''
        - '&7&nCommande:&b /regles'
        - ''
        - '&7&o(( &b&oCliquez pour ouvrir &7&o))'
      commande: 'regles'
      permission: ''
    # --- Économie
    boutique:
      actif: true
      libelle: '&aBoutique'
      infobulle:
        - '&8&l« &aAchetez &7et &avendez &7des blocs,'
        - '&7des minerais, des aliments... &8&l»'
        - ''
        - '&7&nCommande:&a /shop'
        - ''
        - '&7&o(( &a&oCliquez pour ouvrir &7&o))'
      commande: 'shop'
      permission: ''
    metiers:
      actif: true
      libelle: '&aMétiers'
      infobulle:
        - '&8&l« &7Consultez vos &amétiers&7, leur'
        - '&7niveau et vos &apoints de métier &8&l»'
        - ''
        - '&7&nCommande:&a /jobs'
        - ''
        - '&7&o(( &a&oCliquez pour ouvrir &7&o))'
      commande: 'jobs'
      permission: ''
    hdv:
      actif: true
      libelle: '&aHôtel des ventes'
      infobulle:
        - '&8&l« &aVentes directes &7et &aenchères'
        - '&7entre joueurs &8&l»'
        - ''
        - '&7&nCommande:&a /hdv'
        - ''
        - '&7&o(( &a&oCliquez pour ouvrir &7&o))'
      commande: 'hdv'
      permission: ''
    # --- Progression
    quetes:
      actif: true
      libelle: '&dQuêtes'
      infobulle:
        - '&8&l« &7Suivez vos &dquêtes &7en cours'
        - '&7et leurs &drécompenses &8&l»'
        - ''
        - '&7&nCommande:&d /quest'
        - ''
        - '&7&o(( &d&oCliquez pour ouvrir &7&o))'
      commande: 'quest'
      permission: ''
    vote:
      actif: true
      libelle: '&dVotes et récompenses'
      infobulle:
        - '&8&l« &dRécompenses journalières &7et'
        - '&dvotes &7pour SkyHand &8&l»'
        - ''
        - '&7&nCommande:&d /vote'
        - ''
        - '&7&o(( &d&oCliquez pour ouvrir &7&o))'
      commande: 'vote'
      permission: ''
    skyhand:
      actif: true
      libelle: '&dFonctionnalités uniques'
      infobulle:
        - '&8&l« &7Découvrez tout ce que &dSkyHand'
        - '&7propose de plus &8&l»'
        - ''
        - '&7&nCommande:&d /skyhand'
        - ''
        - '&7&o(( &d&oCliquez pour ouvrir &7&o))'
      commande: 'skyhand'
      permission: ''
    # Liens du serveur (Discord, site, vote, boutique) : l'écran Échap n'accepte qu'un seul bouton de dialogue, c'est donc
    # ce menu qui les propose (SHWelcome ne s'en occupe plus). Gardez un nombre pair de boutons actifs : désactivez-les par deux.
    discord:
      actif: true
      libelle: '&9Discord'
      infobulle:
        - '&8&l« &7Rejoignez le serveur &9Discord &8&l»'
        - ''
        - '&7&nLien:&9 discord.skyhand.fr'
        - ''
        - '&7&o(( &9&oCliquez pour ouvrir &7&o))'
      url: 'https://discord.skyhand.fr'
    site:
      actif: true
      libelle: '&bSite web'
      infobulle:
        - '&8&l« &7Le &bsite &7de SkyHand &8&l»'
        - ''
        - '&7&nLien:&b skyhand.fr'
        - ''
        - '&7&o(( &b&oCliquez pour ouvrir &7&o))'
      url: 'https://skyhand.fr'
    voter:
      actif: true
      libelle: '&dVoter'
      infobulle:
        - '&8&l« &7Votez pour &dSkyHand &7et gagnez'
        - '&7des &drécompenses &8&l»'
        - ''
        - '&7&nLien:&d skyhand.fr/vote'
        - ''
        - '&7&o(( &d&oCliquez pour ouvrir &7&o))'
      url: 'https://skyhand.fr/vote'
    boutique-web:
      actif: true
      libelle: '&aBoutique en ligne'
      infobulle:
        - '&8&l« &7La &aboutique en ligne &7de SkyHand &8&l»'
        - ''
        - '&7&nLien:&a store.skyhand.fr'
        - ''
        - '&7&o(( &a&oCliquez pour ouvrir &7&o))'
      url: 'https://store.skyhand.fr'

# ---------------------------------------------------------------------------------------------------------------
# Dialogues à la demande : /shdialogs open <dialogue> [joueur]
# ---------------------------------------------------------------------------------------------------------------
# Chaque dialogue a un titre (affiché en première ligne du texte), un texte (lignes) et des boutons (mêmes champs que
# menu.boutons : libelle, infobulle, url, commande ou fermer, permission, actif). En option : colonnes (1), largeur-bouton
# (200), bouton-fermer (bouton tout en bas ; '' = aucun, Échap ferme toujours le dialogue), permission (du dialogue entier)
# et actif. Une seule adresse par site : changez-la ici, tous les menus qui ouvrent le dialogue la suivent.
dialogues:
  vote:
    titre: '&7&l« &d&lVote &8&l» &7Soutenir SkyHand'
    texte:
      - '&7Votez pour &dSkyHand &7sur nos sites partenaires et'
      - '&7gagnez des &drécompenses &7: clés, temps de fly et d''AFK.'
    boutons:
      voter:
        libelle: '&dVoter maintenant'
        infobulle:
          - '&8&l« &7Choisissez un site de vote puis'
          - '&7validez votre &dvote &8&l»'
          - ''
          - '&7&nLien:&d skyhand.fr/vote'
          - ''
          - '&7&o(( &d&oCliquez pour ouvrir &7&o))'
        url: 'https://skyhand.fr/vote'
  discord:
    titre: '&7&l« &9&lDiscord &8&l» &7SkyHand'
    texte:
      - '&7Rejoignez le serveur &9Discord &7de &9SkyHand &7: annonces,'
      - '&7support par &9ticket &7et notifications de vote.'
    boutons:
      rejoindre:
        libelle: '&9Rejoindre le Discord'
        infobulle:
          - '&8&l« &7Rejoignez le serveur &9Discord &8&l»'
          - ''
          - '&7&nLien:&9 discord.skyhand.fr'
          - ''
          - '&7&o(( &9&oCliquez pour ouvrir &7&o))'
        url: 'https://discord.skyhand.fr'
  # Pour les joueurs dont le compte n'est pas encore lié : /liaison donne un lien, un clic suffit
  discord-liaison:
    titre: '&7&l« &9&lDiscord &8&l» &7Liaison de compte'
    texte:
      - '&7Liez votre compte &9Discord &7en un clic : lancez &e/liaison'
      - '&7puis cliquez le lien. Vous rejoignez le &9Discord &7automatiquement.'
    boutons:
      rejoindre:
        libelle: '&9Rejoindre le Discord'
        infobulle:
          - '&8&l« &7Rejoignez le serveur &9Discord &8&l»'
          - ''
          - '&7&nLien:&9 discord.skyhand.fr'
          - ''
          - '&7&o(( &9&oCliquez pour ouvrir &7&o))'
        url: 'https://discord.skyhand.fr'
      liaison:
        libelle: '&9Lier mon compte'
        infobulle:
          - '&8&l« &7Reliez votre compte &9Minecraft'
          - '&7à votre compte &9Discord &8&l»'
          - ''
          - '&7&nCommande:&9 /liaison'
          - ''
          - '&7&o(( &9&oCliquez pour lancer &7&o))'
        commande: 'liaison'
  # Kit Nitro Booster (menu des kits)
  nitro:
    titre: '&7&l« &d&lKit Nitro &8&l» &7Discord'
    texte:
      - '&7Ce kit est réservé aux &dboosters &7du &9Discord &7de &dSkyHand&7.'
      - '&7Boostez le serveur, puis liez votre compte avec &e/liaison&7.'
    boutons:
      rejoindre:
        libelle: '&9Rejoindre le Discord'
        infobulle:
          - '&8&l« &7Rejoignez le serveur &9Discord &8&l»'
          - ''
          - '&7&nLien:&9 discord.skyhand.fr'
          - ''
          - '&7&o(( &9&oCliquez pour ouvrir &7&o))'
        url: 'https://discord.skyhand.fr'
      liaison:
        libelle: '&9Lier mon compte'
        infobulle:
          - '&8&l« &7Reliez votre compte &9Minecraft'
          - '&7à votre compte &9Discord &8&l»'
          - ''
          - '&7&nCommande:&9 /liaison'
          - ''
          - '&7&o(( &9&oCliquez pour lancer &7&o))'
        commande: 'liaison'
  boutique:
    titre: '&7&l« &a&lBoutique &8&l» &7SkyHand'
    texte:
      - '&7Grades, clés, cosmétiques... la &aboutique en ligne &7de'
      - '&aSkyHand &7soutient le serveur et ses joueurs.'
    boutons:
      ouvrir:
        libelle: '&aOuvrir la boutique'
        infobulle:
          - '&8&l« &7La &aboutique en ligne &7de SkyHand &8&l»'
          - ''
          - '&7&nLien:&a store.skyhand.fr'
          - ''
          - '&7&o(( &a&oCliquez pour ouvrir &7&o))'
        url: 'https://store.skyhand.fr'
  grades:
    titre: '&7&l« &a&lGrades &8&l» &7Boutique'
    texte:
      - '&7Les &agrades &7s''achètent sur la &aboutique en ligne &7de'
      - '&aSkyHand&7 : commandes, récompenses et avantages exclusifs.'
    boutons:
      voir:
        libelle: '&aVoir les grades'
        infobulle:
          - '&8&l« &7Découvrez les &agrades &7et leurs'
          - '&aavantages &7sur la boutique &8&l»'
          - ''
          - '&7&nLien:&a store.skyhand.fr'
          - ''
          - '&7&o(( &a&oCliquez pour ouvrir &7&o))'
        url: 'https://store.skyhand.fr'
  reglement:
    titre: '&7&l« &b&lRèglement &8&l» &7SkyHand'
    texte:
      - '&7Le &brèglement complet &7du serveur est consultable sur'
      - '&7le site de &bSkyHand&7. Merci de le respecter.'
    boutons:
      lire:
        libelle: '&bLire le règlement'
        infobulle:
          - '&8&l« &7Règles générales, chat, cheats/mods'
          - '&7et règles du &bSkyBlock &8&l»'
          - ''
          - '&7&nLien:&b skyhand.fr/reglement'
          - ''
          - '&7&o(( &b&oCliquez pour ouvrir &7&o))'
        url: 'https://skyhand.fr/reglement'
  # Accueil des nouveaux joueurs : ouvert 3 s après le premier join par le kit Essentials « arrivee » (kits.yml), quand
  # le joueur arrive sur son île. Les clients plus anciens que la 1.21.6 ne le voient pas : le message de création
  # d'île de SuperiorSkyblock2 (CREATE_ISLAND) leur donne les mêmes étapes dans le chat.
  bienvenue:
    titre: '&7&l« &e&lSkyHand &8&l» &7Bienvenue !'
    texte:
      - '&aTon île est prête !'
      - '&7Tu démarres sur une petite île perdue dans le vide :'
      - '&7coupe ton &earbre&7, mine ton &egénérateur de pierre &7et'
      - '&7agrandis ton île. Tes &equêtes &7(&e/quest&7) te guident.'
      - ''
      - '&aC''est parti &7: tu joues tout de suite sur ton île.'
      - '&bJe joue avec un ami &7: comment rejoindre son île.'
      - '&eTutoriel détaillé &7: facultatif, une route sous'
      - '&7le spawn qui présente les bases du serveur.'
    # Pas de bouton en bas : « C'est parti », en premier, ferme le dialogue
    bouton-fermer: ''
    boutons:
      parti:
        libelle: '&a&lC''est parti !'
        infobulle:
          - '&8&l« &7Commencer à jouer sur ton &aîle &8&l»'
          - ''
          - '&7&o(( &a&oClique pour fermer &7&o))'
        fermer: true
      ami:
        libelle: '&bJe joue avec un ami'
        infobulle:
          - '&8&l« &7Rejoindre l''île d''un ami &8&l»'
          - ''
          - '&7&o(( &b&oClique pour savoir comment &7&o))'
        commande: 'shdialogs open ami'
      tutoriel:
        libelle: '&eTutoriel détaillé'
        infobulle:
          - '&8&l« &7Une route sous le spawn présente'
          - '&7les bases du serveur &8&l»'
          - ''
          - '&7&nCommande:&e /warp tutoriel'
          - ''
          - '&7&o(( &e&oClique pour y aller &7&o))'
        commande: 'warp tutoriel'
  # Suite de « bienvenue » (bouton « Je joue avec un ami ») : comment rejoindre l'île d'un ami.
  ami:
    titre: '&7&l« &b&lSkyHand &8&l» &7Jouer avec un ami'
    texte:
      - '&7Ton ami tape &b/is invite &7suivi de ton pseudo.'
      - '&7Une invitation s''affiche dans ton chat : &bclique'
      - '&bdessus &7(ou tape &b/rejoindre &7suivi de son pseudo).'
      - ''
      - '&7Ton île de départ est remplacée par la sienne :'
      - '&7tu gardes ton inventaire et tes quêtes.'
    bouton-fermer: '&a&lCompris'
    boutons:
      retour:
        libelle: '&eRetour'
        commande: 'shdialogs open bienvenue'
