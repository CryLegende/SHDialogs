# SHDialogs - menu SkyHand dans l'écran Échap et les actions rapides (Dialog API, clients 1.21.6 et plus)
#
# Un dialogue enregistré dans le registre du serveur au démarrage (clé skyhand:menu) et ajouté aux tags
# PAUSE_SCREEN_ADDITIONS (bouton dans l'écran Échap) et QUICK_ACTIONS (touche « actions rapides » du client).
# ATTENTION : l'aspect du menu (titres, textes, libellés, infobulles, colonnes, liste des boutons) est figé au
# démarrage du serveur. /shdialogs reload ne recharge que les commandes, les permissions et les messages.
#
# Dialogues à la demande (section « dialogues », plus bas) : /shdialogs open <dialogue> [joueur] en ouvre un depuis un
# menu DeluxeMenus (« [player] shdialogs open vote », à la suite du texte classique du menu), une commande, un NPC...
# Ils sont construits à l'exécution : /shdialogs reload les recharge, sans redémarrage. Les clients plus anciens que la
# 1.21.6 ne les voient pas : ils reçoivent seulement un avertissement.
#
# Codes de couleur : &a, &l... et &#rrggbb. Chaque commande est exécutée PAR LE JOUEUR, jamais par la console.
#
# Charte de rendu (même esprit que les menus DeluxeMenus du serveur) :
#   - le fond du dialogue est sombre : &8 est lisible pour les cadres « » du titre et du texte ;
#   - les BOUTONS ont un fond gris moyen : jamais de &8 ni de &0 dans un libellé de bouton, couleurs claires ou blanc ;
#   - les infobulles ont le fond sombre des infobulles du jeu : &8 y est lisible.

# Préfixe des messages du chat. {couleur} est remplacé par la couleur du type de message (voir plus bas).
prefixe: '&7&l« &{couleur}&lSH &8&l» &7'
couleurs:
  erreur: 'c'
  succes: 'a'
  info: 'e'
  avertissement: '6'

# ---------------------------------------------------------------------------------------------------------------
# Menu SkyHand
# ---------------------------------------------------------------------------------------------------------------
menu:
  actif: true
  # Bouton « Menu SkyHand » dans l'écran Échap
  ecran-echap: true
  # Entrée dans les actions rapides du client
  actions-rapides: true
  titre: '&7&l« &e&lSkyHand &8&l» &7Menu'
  # Texte du bouton dans l'écran Échap et dans la liste des actions rapides (court, lisible sur fond gris)
  titre-bouton: '&eMenu SkyHand'
  texte:
    - '&7Accédez en un clic aux &emenus principaux &7de &eSkyHand&7.'
    - '&7&oAstuce : survolez un bouton pour voir sa commande.'
  colonnes: 2
  largeur-bouton: 150
  bouton-fermer: '&c⤾ &fFermer'
  # Chaque bouton lance UNE commande joueur (sans le /). Les boutons sont affichés dans cet ordre, sur 2 colonnes
  # (gardez un nombre PAIR de boutons actifs). Une couleur par thème : &b navigation, &a économie, &d progression.
  #   libelle    : texte du bouton, d'UNE couleur et sans gras
  #   infobulle  : lignes affichées au survol (facultatif) : phrase encadrée, commande, invitation au clic
  #   commande   : commande lancée par le joueur, comme s'il la tapait dans le chat
  #   url        : à la place de commande, ouvre une adresse http(s) (le client demande confirmation)
  #   permission : permission nécessaire (facultatif, vide = tout le monde)
  #   actif      : false pour masquer le bouton
  boutons:
    # --- Navigation
    ile:
      actif: true
      libelle: '&bMon île'
      infobulle:
        - '&8&l« &7Gérez votre &bîle &7: améliorations,'
        - '&7paramètres, &bbanque &7et &bwarps &8&l»'
        - ''
        - '&7&nCommande:&b /is'
        - ''
        - '&7&o(( &b&oCliquez pour ouvrir &7&o))'
      commande: 'is'
      permission: ''
    general:
      actif: true
      libelle: '&bMenu général'
      infobulle:
        - '&8&l« &7Le &bmenu général &7: boutique,'
        - '&7métiers, ventes, collectibles,'
        - '&bwarps &7et &bkits &8&l»'
        - ''
        - '&7&nCommande:&b /is more'
        - ''
        - '&7&o(( &b&oCliquez pour ouvrir &7&o))'
      commande: 'is more'
      permission: ''
    warps:
      actif: true
      libelle: '&bWarps'
      infobulle:
        - '&8&l« &bArène&7, &b1v1&7, &benchantement&7,'
        - "&7top et bien d'autres &bwarps &8&l»"
        - ''
        - '&7&nCommande:&b /warp'
        - ''
        - '&7&o(( &b&oCliquez pour ouvrir &7&o))'
      commande: 'warp'
      permission: ''
    # Menu DeluxeMenus « Règlement du SkyBlock » : règles générales, chat, cheats/mods, autres et règles du SkyBlock
    reglement:
      actif: true
      libelle: '&bRèglement'
      infobulle:
        - '&8&l« &7Consultez les &brègles générales'
        - '&7du serveur et celles du &bSkyBlock &8&l»'
        - ''
        - '&7&nCommande:&b /regles'
        - ''
        - '&7&o(( &b&oCliquez pour ouvrir &7&o))'
      commande: 'regles'
      permission: ''
    # --- Économie
    boutique:
      actif: true
      libelle: '&aBoutique'
      infobulle:
        - '&8&l« &aAchetez &7et &avendez &7des blocs,'
        - '&7des minerais, des aliments... &8&l»'
        - ''
        - '&7&nCommande:&a /shop'
        - ''
        - '&7&o(( &a&oCliquez pour ouvrir &7&o))'
      commande: 'shop'
      permission: ''
    metiers:
      actif: true
      libelle: '&aMétiers'
      infobulle:
        - '&8&l« &7Consultez vos &amétiers&7, leur'
        - '&7niveau et vos &apoints de métier &8&l»'
        - ''
        - '&7&nCommande:&a /jobs'
        - ''
        - '&7&o(( &a&oCliquez pour ouvrir &7&o))'
      commande: 'jobs'
      permission: ''
    hdv:
      actif: true
      libelle: '&aHôtel des ventes'
      infobulle:
        - '&8&l« &aVentes directes &7et &aenchères'
        - '&7entre joueurs &8&l»'
        - ''
        - '&7&nCommande:&a /hdv'
        - ''
        - '&7&o(( &a&oCliquez pour ouvrir &7&o))'
      commande: 'hdv'
      permission: ''
    # --- Progression
    quetes:
      actif: true
      libelle: '&dQuêtes'
      infobulle:
        - '&8&l« &7Suivez vos &dquêtes &7en cours'
        - '&7et leurs &drécompenses &8&l»'
        - ''
        - '&7&nCommande:&d /quest'
        - ''
        - '&7&o(( &d&oCliquez pour ouvrir &7&o))'
      commande: 'quest'
      permission: ''
    vote:
      actif: true
      libelle: '&dVotes et récompenses'
      infobulle:
        - '&8&l« &dRécompenses journalières &7et'
        - '&dvotes &7pour SkyHand &8&l»'
        - ''
        - '&7&nCommande:&d /vote'
        - ''
        - '&7&o(( &d&oCliquez pour ouvrir &7&o))'
      commande: 'vote'
      permission: ''
    skyhand:
      actif: true
      libelle: '&dFonctionnalités uniques'
      infobulle:
        - '&8&l« &7Découvrez tout ce que &dSkyHand'
        - '&7propose de plus &8&l»'
        - ''
        - '&7&nCommande:&d /skyhand'
        - ''
        - '&7&o(( &d&oCliquez pour ouvrir &7&o))'
      commande: 'skyhand'
      permission: ''
    # Liens du serveur (Discord, site, vote, boutique) : l'écran Échap n'accepte qu'un seul bouton de dialogue, c'est donc
    # ce menu qui les propose (SHWelcome ne s'en occupe plus). Gardez un nombre pair de boutons actifs : désactivez-les par deux.
    discord:
      actif: true
      libelle: '&9Discord'
      infobulle:
        - '&8&l« &7Rejoignez le serveur &9Discord &8&l»'
        - ''
        - '&7&nLien:&9 discord.skyhand.fr'
        - ''
        - '&7&o(( &9&oCliquez pour ouvrir &7&o))'
      url: 'https://discord.skyhand.fr'
    site:
      actif: true
      libelle: '&bSite web'
      infobulle:
        - '&8&l« &7Le &bsite &7de SkyHand &8&l»'
        - ''
        - '&7&nLien:&b skyhand.fr'
        - ''
        - '&7&o(( &b&oCliquez pour ouvrir &7&o))'
      url: 'https://skyhand.fr'
    voter:
      actif: true
      libelle: '&dVoter'
      infobulle:
        - '&8&l« &7Votez pour &dSkyHand &7et gagnez'
        - '&7des &drécompenses &8&l»'
        - ''
        - '&7&nLien:&d skyhand.fr/vote'
        - ''
        - '&7&o(( &d&oCliquez pour ouvrir &7&o))'
      url: 'https://skyhand.fr/vote'
    boutique-web:
      actif: true
      libelle: '&aBoutique en ligne'
      infobulle:
        - '&8&l« &7La &aboutique en ligne &7de SkyHand &8&l»'
        - ''
        - '&7&nLien:&a store.skyhand.fr'
        - ''
        - '&7&o(( &a&oCliquez pour ouvrir &7&o))'
      url: 'https://store.skyhand.fr'

# ---------------------------------------------------------------------------------------------------------------
# Dialogues à la demande : /shdialogs open <dialogue> [joueur]
# ---------------------------------------------------------------------------------------------------------------
# Chaque dialogue a un titre, un texte (lignes) et des boutons (mêmes champs que menu.boutons : libelle, infobulle, url ou
# commande, permission, actif). En option : colonnes (1), largeur-bouton (200), bouton-fermer, permission (du dialogue
# entier) et actif. Une seule adresse par site : changez-la ici, tous les menus qui ouvrent le dialogue la suivent.
dialogues:
  vote:
    titre: '&7&l« &d&lVote &8&l» &7Soutenir SkyHand'
    texte:
      - '&7Votez pour &dSkyHand &7sur nos sites partenaires et'
      - '&7gagnez des &drécompenses &7: clés, temps de fly et d''AFK.'
    boutons:
      voter:
        libelle: '&dVoter maintenant'
        infobulle:
          - '&8&l« &7Choisissez un site de vote puis'
          - '&7validez votre &dvote &8&l»'
          - ''
          - '&7&nLien:&d skyhand.fr/vote'
          - ''
          - '&7&o(( &d&oCliquez pour ouvrir &7&o))'
        url: 'https://skyhand.fr/vote'
  discord:
    titre: '&7&l« &9&lDiscord &8&l» &7SkyHand'
    texte:
      - '&7Rejoignez le serveur &9Discord &7de &9SkyHand &7: annonces,'
      - '&7support par &9ticket &7et notifications de vote.'
    boutons:
      rejoindre:
        libelle: '&9Rejoindre le Discord'
        infobulle:
          - '&8&l« &7Rejoignez le serveur &9Discord &8&l»'
          - ''
          - '&7&nLien:&9 discord.skyhand.fr'
          - ''
          - '&7&o(( &9&oCliquez pour ouvrir &7&o))'
        url: 'https://discord.skyhand.fr'
  # Pour les joueurs dont le compte n'est pas encore lié : rejoindre le Discord puis lancer /liaison
  discord-liaison:
    titre: '&7&l« &9&lDiscord &8&l» &7Liaison de compte'
    texte:
      - '&7Rejoignez le &9Discord &7puis liez votre compte avec'
      - '&e/liaison &7pour recevoir vos &9rôles &7et vos notifications.'
    boutons:
      rejoindre:
        libelle: '&9Rejoindre le Discord'
        infobulle:
          - '&8&l« &7Rejoignez le serveur &9Discord &8&l»'
          - ''
          - '&7&nLien:&9 discord.skyhand.fr'
          - ''
          - '&7&o(( &9&oCliquez pour ouvrir &7&o))'
        url: 'https://discord.skyhand.fr'
      liaison:
        libelle: '&9Lier mon compte'
        infobulle:
          - '&8&l« &7Reliez votre compte &9Minecraft'
          - '&7à votre compte &9Discord &8&l»'
          - ''
          - '&7&nCommande:&9 /liaison'
          - ''
          - '&7&o(( &9&oCliquez pour lancer &7&o))'
        commande: 'liaison'
  # Kit Nitro Booster (menu des kits)
  nitro:
    titre: '&7&l« &d&lKit Nitro &8&l» &7Discord'
    texte:
      - '&7Ce kit est réservé aux &dboosters &7du &9Discord &7de &dSkyHand&7.'
      - '&7Boostez le serveur, puis liez votre compte avec &e/liaison&7.'
    boutons:
      rejoindre:
        libelle: '&9Rejoindre le Discord'
        infobulle:
          - '&8&l« &7Rejoignez le serveur &9Discord &8&l»'
          - ''
          - '&7&nLien:&9 discord.skyhand.fr'
          - ''
          - '&7&o(( &9&oCliquez pour ouvrir &7&o))'
        url: 'https://discord.skyhand.fr'
      liaison:
        libelle: '&9Lier mon compte'
        infobulle:
          - '&8&l« &7Reliez votre compte &9Minecraft'
          - '&7à votre compte &9Discord &8&l»'
          - ''
          - '&7&nCommande:&9 /liaison'
          - ''
          - '&7&o(( &9&oCliquez pour lancer &7&o))'
        commande: 'liaison'
  boutique:
    titre: '&7&l« &a&lBoutique &8&l» &7SkyHand'
    texte:
      - '&7Grades, clés, cosmétiques... la &aboutique en ligne &7de'
      - '&aSkyHand &7soutient le serveur et ses joueurs.'
    boutons:
      ouvrir:
        libelle: '&aOuvrir la boutique'
        infobulle:
          - '&8&l« &7La &aboutique en ligne &7de SkyHand &8&l»'
          - ''
          - '&7&nLien:&a store.skyhand.fr'
          - ''
          - '&7&o(( &a&oCliquez pour ouvrir &7&o))'
        url: 'https://store.skyhand.fr'
  grades:
    titre: '&7&l« &a&lGrades &8&l» &7Boutique'
    texte:
      - '&7Les &agrades &7s''achètent sur la &aboutique en ligne &7de'
      - '&aSkyHand&7 : commandes, récompenses et avantages exclusifs.'
    boutons:
      voir:
        libelle: '&aVoir les grades'
        infobulle:
          - '&8&l« &7Découvrez les &agrades &7et leurs'
          - '&aavantages &7sur la boutique &8&l»'
          - ''
          - '&7&nLien:&a store.skyhand.fr'
          - ''
          - '&7&o(( &a&oCliquez pour ouvrir &7&o))'
        url: 'https://store.skyhand.fr'
  reglement:
    titre: '&7&l« &b&lRèglement &8&l» &7SkyHand'
    texte:
      - '&7Le &brèglement complet &7du serveur est consultable sur'
      - '&7le site de &bSkyHand&7. Merci de le respecter.'
    boutons:
      lire:
        libelle: '&bLire le règlement'
        infobulle:
          - '&8&l« &7Règles générales, chat, cheats/mods'
          - '&7et règles du &bSkyBlock &8&l»'
          - ''
          - '&7&nLien:&b skyhand.fr/reglement'
          - ''
          - '&7&o(( &b&oCliquez pour ouvrir &7&o))'
        url: 'https://skyhand.fr/reglement'

# ---------------------------------------------------------------------------------------------------------------
# Messages du chat (sans préfixe : il dépend du type, voir « prefixe » et « couleurs » plus haut)
# ---------------------------------------------------------------------------------------------------------------
messages:
  erreur:
    joueur-seulement: 'Commande réservée aux &cjoueurs&7.'
    permission: 'Vous n''avez pas la permission.'
    usage: 'Utilisation : &e/shdialogs <reload|menu|open>&7.'
    open-usage: 'Utilisation : &e/shdialogs open <dialogue> [joueur]&7.'
    dialogue-inconnu: 'Le dialogue &e{dialogue} &7n''existe pas.'
    dialogue-permission: 'Vous n''avez pas accès à ce dialogue.'
    joueur-introuvable: 'Le joueur &e{joueur} &7n''est pas connecté.'
    console-joueur: 'La console doit indiquer un joueur : &e/shdialogs open <dialogue> <joueur>&7.'
    menu-indisponible: 'Le menu SkyHand n''est pas chargé (voir la console).'
    bouton-indisponible: 'Ce bouton n''est plus disponible.'
    bouton-permission: 'Vous n''avez pas accès à &e{bouton}&7.'
    commande-echec: 'La commande &e/{commande} &7n''a pas pu être lancée.'
    version-ancienne: 'Votre version de Minecraft ne gère pas ce menu : il faut la &e1.21.6 &7ou plus.'
    erreur-interne: 'Une erreur est survenue : réessayez, ou prévenez un membre du &cstaff&7.'
  succes:
    recharge: 'Configuration &arechargée&7.'
    ouvert: 'Dialogue &e{dialogue} &7ouvert pour &e{joueur}&7.'
  info:
    menu-redemarrage: 'L''aspect du menu SkyHand a changé : il ne sera mis à jour qu''au &eprochain redémarrage&7.'
  avertissement:
    # Client sans dialogues (avant la 1.21.6) : pas de repli, les menus DeluxeMenus gardent leur texte classique.
    # L'avertissement va à celui qui lance la commande : au joueur lui-même, ou au staff / à la console s'ils l'ouvrent à un autre joueur.
    version-ancienne: 'Votre version de Minecraft ne gère pas les dialogues : il faut la &e1.21.6 &7ou plus.'
    version-ancienne-autre: 'Le joueur &e{joueur} &7ne gère pas les dialogues (&e1.21.6 &7minimum).'
